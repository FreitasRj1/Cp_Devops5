name: Security Pipeline

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (segredos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: semgrep scan --config p/default --config p/javascript --exclude .github --error --metrics=off .

  trivy:
    name: Trivy (CVE na imagem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t cp05-site:${{ github.sha }} .
      - name: Trivy scan (falha em CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --severity CRITICAL --exit-code 1 --ignore-unfixed \
            cp05-site:${{ github.sha }}
